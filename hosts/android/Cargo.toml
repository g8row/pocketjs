# android-host — the PocketJS UI runtime as a native Android activity.
#
# STANDALONE LONE-BIN CRATE (same model as hosts/pocketbook): outside any
# workspace, with path dependencies on the engine crates. It reuses the
# backend-agnostic `ui` surface (pocket-ui-surface) and the core's incremental
# software rasterizer, then copies only the damaged rows straight into the
# ANativeWindow buffer (RGBA8888, 1:1, no scaling when the 960×544 render fits).
#
# No Java/Kotlin: NativeActivity + android-activity. See README.md for the
# APK packaging (build.sh) and target profile.

[package]
name = "android-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PocketJS UI runtime host for Android (NativeActivity, software raster to ANativeWindow)"

[lib]
name = "pocketjs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Kiosk mode: the same runtime without the Android framework — draws straight to
# /dev/graphics/fb0 and reads /dev/input (run as root, framework stopped).
[[bin]]
name = "pocketjs-kiosk"
path = "src/kiosk.rs"

[dependencies]
pocketjs-core = { path = "../../engine/core", features = ["std"] }
pocket-mod = { path = "../../engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../../engine/crates/pocket-ui-surface" }

anyhow = "1"
log = "0.4"
base64 = "0.22"
serde_json = "1"
libc = "0.2"

# rquickjs ships no pre-generated FFI bindings for Android targets; generate
# them at build time (bindgen, needs libclang — the NDK's own is used, see
# build.sh).
# GPU presenter (wgpu GLES backend) — opt-in: `cargo ndk … --features gpu`.
pocket-ui-wgpu = { path = "../../engine/crates/pocket-ui-wgpu", optional = true }
pocket3d = { path = "../../engine/pocket3d/crates/pocket3d", optional = true }
wgpu = { version = "25", optional = true, default-features = false, features = ["gles", "wgsl"] }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "0.4", optional = true }

[features]
gpu = ["dep:pocket-ui-wgpu", "dep:pocket3d", "dep:wgpu", "dep:raw-window-handle", "dep:pollster"]

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", features = ["bindgen"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
ndk-sys = "0.6"
android_logger = "0.14"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
